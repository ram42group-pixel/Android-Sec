name: Build
on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -oq src.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - run: bash ci/test.sh

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -oq src.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: bash ci/android.sh
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: SuicaKey-android
          path: SuicaKey-android.apk

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: 7z x src.zip -y
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - run: bash ci/windows.sh
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: SuicaKey-windows
          path: SuicaKey-windows.zip

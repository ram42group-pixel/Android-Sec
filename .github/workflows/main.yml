name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          set -e
          if [ -f MainActivity.kt ] && grep -q applicationId build.gradle.kts; then
            mkdir -p app/src/main/java/com/rarn/suicakey
            mv MainActivity.kt app/src/main/java/com/rarn/suicakey/
            mv AndroidManifest.xml app/src/main/
            mv build.gradle.kts app/build.gradle.kts
            cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
          }
          EOF
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SuicaKey-apk
          path: app/build/outputs/apk/debug/app-debug.apk
